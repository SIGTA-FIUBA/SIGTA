version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/", "/web"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # openapi-typescript does not support the TypeScript 7 compiler API yet
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # the types follow the Node version used in CI and in the images
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /services/backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      gomod:
        patterns: ["*"]
