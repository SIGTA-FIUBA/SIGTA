name: Deploy

# main to prod and develop to dev (docs/15-despliegue.md).
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Both environments share the entry.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/sigta-fiuba/sigta
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/928624274175/locations/global/workloadIdentityPools/github/providers/sigta
  GCP_SERVICE_ACCOUNT: sigta-deploy@summer-function-513519-a1.iam.gserviceaccount.com
  GCP_PROJECT: summer-function-513519-a1
  GCP_ZONE: southamerica-east1-b
  GCP_VM: sigta
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  SIGTA_HOST: ${{ github.ref_name == 'main' && 'sigta.lopeztancredi.com.ar' || 'sigta-dev.lopeztancredi.com.ar' }}

jobs:
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            context: services/backend
            file: services/backend/Dockerfile
          - image: proxy
            context: .
            file: deploy/nginx/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      url: https://${{ env.SIGTA_HOST }}
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Copy the stack to the VM
        run: |
          gcloud compute scp --recurse deploy/swarm deploy/postgres "$GCP_VM:~/" \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
      - name: Deploy
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BACKEND_DB_PASSWORD: ${{ secrets.BACKEND_DB_PASSWORD }}
          BACKEND_MIGRATIONS_DB_PASSWORD: ${{ secrets.BACKEND_MIGRATIONS_DB_PASSWORD }}
          AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          for name in GHCR_USER GHCR_TOKEN POSTGRES_PASSWORD BACKEND_DB_PASSWORD BACKEND_MIGRATIONS_DB_PASSWORD \
            AI_DB_PASSWORD GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            printf '%s=%s\n' "$name" "$(printenv "$name")"
          done | gcloud compute ssh "$GCP_VM" \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" --tunnel-through-iap --quiet \
            --command "sudo sh swarm/deploy.sh $ENVIRONMENT $GITHUB_SHA $SIGTA_HOST"
      - name: Check SIGTA
        run: |
          curl --fail --silent --show-error --output /dev/null --retry 10 --retry-delay 3 --retry-all-errors "https://$SIGTA_HOST/"
          curl --fail --silent --show-error --output /dev/null --retry 10 --retry-delay 3 --retry-all-errors "https://$SIGTA_HOST/api/procedure-types"
