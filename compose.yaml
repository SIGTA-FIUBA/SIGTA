# Local environment: `docker compose up --build` starts SIGTA at
# http://localhost:8000, with the API under /api/. The credentials are for
# development only.
name: sigta

services:
  proxy:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "${SIGTA_PORT:-8000}:80"
    depends_on:
      - backend

  backend:
    build: ./services/backend
    environment:
      SIGTA_DATABASE_URL: postgres://backend:backend@db:5432/sigta?sslmode=disable
      SIGTA_ENV: development
      SIGTA_PUBLIC_URL: http://localhost:${SIGTA_PORT:-8000}/api
      SIGTA_APP_URL: http://localhost:${SIGTA_PORT:-8000}/
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Applies the migrations and exits. It runs apart from the backend so that
  # the server never has the credential of the role that owns the tables.
  migrate:
    build: ./services/backend
    command: ["migrate"]
    environment:
      SIGTA_MIGRATIONS_DATABASE_URL: postgres://backend_migrations:backend_migrations@db:5432/sigta?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: sigta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SIGTA_BACKEND_DB_PASSWORD: backend
      SIGTA_BACKEND_MIGRATIONS_DB_PASSWORD: backend_migrations
      SIGTA_AI_DB_PASSWORD: ai
    volumes:
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Over TCP: while init.sh runs, the temporary server only listens on the
      # socket, so this is not ready until the roles exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sigta"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
