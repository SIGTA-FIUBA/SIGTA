# Local environment: `docker compose up --build` starts SIGTA at
# http://localhost:8000, with the API under /api/. The credentials are for
# development only.
name: sigta

services:
  proxy:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "${SIGTA_PORT:-8000}:80"
    depends_on:
      - backend

  backend:
    build: ./services/backend
    environment:
      SIGTA_DATABASE_URL: postgres://backend:backend@db:5432/sigta?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: sigta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SIGTA_BACKEND_DB_PASSWORD: backend
      SIGTA_AI_DB_PASSWORD: ai
    volumes:
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sigta"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
