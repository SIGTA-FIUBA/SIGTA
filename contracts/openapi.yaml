openapi: 3.0.3
info:
  title: SIGTA
  version: 0.1.0
paths:
  /auth/login:
    get:
      operationId: beginLogin
      summary: Redirige al proveedor de identidad
      parameters:
        - name: login_hint
          in: query
          required: false
          description: Correo sugerido al proveedor de identidad
          schema:
            type: string
      responses:
        "302":
          description: Redirección al proveedor de identidad
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: >
                Cookie con el ingreso pendiente (state, nonce y code verifier de
                PKCE) que se verifica al volver del proveedor
              schema:
                type: string
  /auth/callback:
    get:
      operationId: completeLogin
      summary: Recibe la respuesta del proveedor de identidad y abre la sesión
      description: >
        Es una navegación del navegador, así que siempre redirige: a la
        aplicación si se abrió la sesión, y a la página de ingreso con el
        parámetro error (un LoginError) si no. El ingreso pendiente sirve una
        sola vez: las dos redirecciones vencen la cookie sigta_login_state, así
        que la de la sesión abierta lleva dos encabezados Set-Cookie.
      parameters:
        - name: code
          in: query
          required: false
          description: Falta cuando el proveedor responde con error
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: >
            Error del proveedor, por ejemplo access_denied cuando la persona
            cancela el ingreso
          schema:
            type: string
        - name: sigta_login_state
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "302":
          description: >
            Redirección a la aplicación con la sesión abierta, o a la página de
            ingreso con el parámetro error
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: >
                Cookie del ingreso pendiente vencida y, si se abrió la sesión,
                cookie de sesión
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "204":
          description: Sesión cerrada
          headers:
            Set-Cookie:
              description: Cookie de sesión vencida
              schema:
                type: string
  /me:
    get:
      operationId: getCurrentUser
      summary: Perfil de la persona con sesión abierta
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /procedure-types:
    get:
      operationId: listProcedureTypes
      summary: Catálogo de los tipos de trámite publicados
      description: >
        Es público: sirve para saber si un trámite corresponde antes de tener
        una sesión. Muestra la última versión de cada tipo de trámite y solo lo
        que le toca aportar al titular.
      responses:
        "200":
          description: Tipos de trámite
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogEntry"
  /areas:
    post:
      operationId: createArea
      summary: Crea un área del personal
      description: >
        Solo para administradores (ADR-017). El identificador queda fijo: va en
        minúsculas, empieza con una letra y no puede ser applicant ni el de un
        área existente o dada de baja. El nombre no puede repetir el de otra
        área.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewArea"
      responses:
        "201":
          description: Área creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /memberships:
    post:
      operationId: grantMembership
      summary: Otorga una membresía a una persona
      description: >
        Solo para administradores (ADR-017). La membresía pone a la persona en
        un área con un perfil, opcionalmente solo para algunos tipos de trámite
        (scope), y con una vigencia. No puede repetir el área y el alcance de
        otra membresía vigente de la misma persona.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMembership"
      responses:
        "201":
          description: Membresía otorgada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  parameters:
    SessionCookie:
      name: sigta_session
      in: cookie
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Pedido inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Sin sesión válida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: La persona no tiene permiso para esta acción
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    LoginError:
      type: string
      description: >
        Por qué no se abrió la sesión al volver del proveedor. state_mismatch:
        el ingreso no es el que inició este navegador. rejected: el proveedor
        lo rechazó o la persona lo canceló. domain_not_allowed: la cuenta no es
        del dominio institucional.
      enum: [state_mismatch, rejected, domain_not_allowed]
    Role:
      type: string
      description: >
        Se deriva de las membresías (ADR-017). staff: tiene al menos una
        membresía vigente en un área. applicant: cualquier otra persona.
      enum: [applicant, staff]
    FieldRequirement:
      type: object
      required: [id, name, required]
      properties:
        id:
          type: string
        name:
          type: string
        required:
          type: boolean
    DocumentRequirement:
      type: object
      required: [id, name, required, accepted_types, max_size]
      properties:
        id:
          type: string
        name:
          type: string
        required:
          type: boolean
        accepted_types:
          type: array
          description: Tipos de medio aceptados, como application/pdf
          items:
            type: string
        max_size:
          type: integer
          format: int64
          description: Tamaño máximo en bytes
    CatalogEntry:
      type: object
      required:
        [id, version, name, description, deadlines, admissibility, fields, documents]
      properties:
        id:
          type: integer
          format: int64
        version:
          type: integer
        name:
          type: string
        description:
          type: string
        deadlines:
          type: array
          items:
            type: string
        admissibility:
          type: array
          description: Condiciones de admisibilidad, como texto informativo
          items:
            type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldRequirement"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRequirement"
    User:
      type: object
      required: [id, email, name, role, administrator]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        administrator:
          type: boolean
          description: Si puede otorgar y dar de baja membresías. No da acceso a los trámites
    Area:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    NewArea:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Minúsculas, dígitos y guiones bajos, empezando con una letra
        name:
          type: string
    Profile:
      type: string
      description: >
        staff_approver cubre también los pasos de staff_operative.
      enum: [staff_operative, staff_approver]
    NewMembership:
      type: object
      required: [user_id, area, profile]
      properties:
        user_id:
          type: string
        area:
          type: string
          description: Identificador del área
        profile:
          $ref: "#/components/schemas/Profile"
        scope:
          type: array
          description: >
            Tipos de trámite a los que se limita. Vacío o ausente vale para
            todos, incluidos los que se publiquen después
          items:
            type: integer
            format: int64
        from:
          type: string
          format: date-time
          description: Desde cuándo vale. Ausente vale desde ahora
        until:
          type: string
          format: date-time
          description: Hasta cuándo vale. Ausente vale hasta que se la dé de baja
    Membership:
      type: object
      required: [id, user_id, area, profile, scope, from, granted_by]
      properties:
        id:
          type: string
        user_id:
          type: string
        area:
          type: string
        profile:
          $ref: "#/components/schemas/Profile"
        scope:
          type: array
          items:
            type: integer
            format: int64
        from:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        granted_by:
          type: string
