openapi: 3.0.3
info:
  title: SIGTA
  version: 0.1.0
paths:
  /auth/login:
    get:
      operationId: beginLogin
      summary: Redirige al proveedor de identidad
      parameters:
        - name: login_hint
          in: query
          required: false
          description: Correo sugerido al proveedor de identidad
          schema:
            type: string
      responses:
        "302":
          description: Redirección al proveedor de identidad
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: >
                Cookie con el ingreso pendiente (state, nonce y code verifier de
                PKCE) que se verifica al volver del proveedor
              schema:
                type: string
  /auth/callback:
    get:
      operationId: completeLogin
      summary: Recibe la respuesta del proveedor de identidad y abre la sesión
      description: >
        Es una navegación del navegador, así que siempre redirige: a la
        aplicación si se abrió la sesión, y a la página de ingreso con el
        parámetro error (un LoginError) si no. El ingreso pendiente sirve una
        sola vez: las dos redirecciones vencen la cookie sigta_login_state, así
        que la de la sesión abierta lleva dos encabezados Set-Cookie.
      parameters:
        - name: code
          in: query
          required: false
          description: Falta cuando el proveedor responde con error
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: >
            Error del proveedor, por ejemplo access_denied cuando la persona
            cancela el ingreso
          schema:
            type: string
        - name: sigta_login_state
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "302":
          description: >
            Redirección a la aplicación con la sesión abierta, o a la página de
            ingreso con el parámetro error
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: >
                Cookie del ingreso pendiente vencida y, si se abrió la sesión,
                cookie de sesión
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "204":
          description: Sesión cerrada
          headers:
            Set-Cookie:
              description: Cookie de sesión vencida
              schema:
                type: string
  /me:
    get:
      operationId: getCurrentUser
      summary: Perfil de la persona con sesión abierta
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /procedure-types:
    get:
      operationId: listProcedureTypes
      summary: Catálogo de los tipos de trámite publicados
      description: >
        Es público: sirve para saber si un trámite corresponde antes de tener
        una sesión. Muestra la última versión de cada tipo de trámite y solo lo
        que le toca aportar al titular.
      responses:
        "200":
          description: Tipos de trámite
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogEntry"
  /areas:
    post:
      operationId: createArea
      summary: Crea un área del personal
      description: >
        Solo para administradores (ADR-020). El identificador queda fijo: va en
        minúsculas, empieza con una letra y no puede ser el de un área
        existente o dada de baja, ni el de la Secretaría (secretariat), que
        trae SIGTA. El nombre no puede repetir el de otra área. El área empieza
        sin permisos ni roles.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewArea"
      responses:
        "201":
          description: Área creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /areas/{areaId}/permissions:
    post:
      operationId: createPermission
      summary: Crea un permiso en un área del personal
      description: >
        Solo para administradores (ADR-020). Los permisos son de un área y los
        exigen los pasos del personal de esa área. El identificador queda fijo
        y no puede repetir el de otro permiso del área, aunque esté dado de
        baja. El nombre no puede repetir el de otro permiso del área. En la
        Secretaría están reservados edit_procedure_types y
        publish_procedure_types, que trae SIGTA.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - name: areaId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPermission"
      responses:
        "201":
          description: Permiso creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /areas/{areaId}/roles:
    post:
      operationId: createRole
      summary: Crea un rol en un área del personal
      description: >
        Solo para administradores (ADR-020). Un rol agrupa permisos del área
        para otorgarlos juntos. El identificador queda fijo y no puede repetir
        el de otro rol del área, aunque esté dado de baja. El nombre no puede
        repetir el de otro rol del área.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - name: areaId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRole"
      responses:
        "201":
          description: Rol creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /areas/{areaId}/roles/{roleId}/permissions:
    put:
      operationId: updateRolePermissions
      summary: Reemplaza los permisos de un rol
      description: >
        Solo para administradores (ADR-020). Cambia al instante lo que puede
        hacer cada persona con una membresía que tiene el rol. El cambio queda
        registrado con quién y cuándo.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - name: areaId
          in: path
          required: true
          schema:
            type: string
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePermissions"
      responses:
        "200":
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No existe el área o el rol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /memberships:
    post:
      operationId: grantMembership
      summary: Otorga una membresía a una persona
      description: >
        Solo para administradores (ADR-020). La membresía pone a la persona en
        un área con algunos de sus roles y permisos, opcionalmente solo para
        algunos tipos de trámite (scope), y con una vigencia. No puede repetir el área y el alcance de
        otra membresía vigente de la misma persona.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMembership"
      responses:
        "201":
          description: Membresía otorgada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /procedures/{procedureId}:
    get:
      operationId: getProcedure
      summary: Detalle de un trámite
      description: >
        Para quien puede ver el trámite: su titular y el personal de las áreas
        por las que pasa. Muestra los pasos de la versión con la que se inició,
        en el orden en que los declara, con quién hace cada uno y los
        documentos que pide, y cuál es el paso abierto. Para quien no lo ve,
        el trámite no existe.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - $ref: "#/components/parameters/ProcedureId"
      responses:
        "200":
          description: El trámite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /procedures/{procedureId}/documents:
    parameters:
      - $ref: "#/components/parameters/ProcedureId"
    get:
      operationId: listProcedureDocuments
      summary: Documentos adjuntos a un trámite
      description: >
        Para quien puede ver el trámite: su titular y el personal de las áreas
        por las que pasa. Están en el orden en que se adjuntaron, incluidos los
        que otro documento reemplazó.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Documentos del trámite
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcedureDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: attachProcedureDocument
      summary: Adjunta un documento a un trámite
      description: >
        Adjunta un archivo para un documento que pide el paso abierto, y solo
        quien puede hacer ese paso. El servidor reconoce el tipo por el
        contenido del archivo, no por su nombre, y lo compara con los tipos y
        el tamaño máximo del documento. Adjuntar otro archivo para el mismo
        documento reemplaza al anterior, que queda registrado. Un trámite
        guarda hasta 20 archivos por documento.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document, file]
              properties:
                document:
                  type: string
                  description: Identificador del documento que pide el paso. Va antes que file
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Documento adjunto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /procedures/{procedureId}/documents/{documentId}/content:
    parameters:
      - $ref: "#/components/parameters/ProcedureId"
      - name: documentId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: downloadProcedureDocument
      summary: Descarga el archivo de un documento adjunto
      description: >
        Para quien puede ver el trámite. Las cabeceras piden al navegador que
        guarde el archivo en vez de mostrarlo, y que no lo interprete si igual
        lo abre.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: El archivo, con el tipo que reconoció el servidor
          headers:
            Content-Disposition:
              required: true
              description: Siempre attachment, con el nombre del archivo
              schema:
                type: string
            X-Content-Type-Options:
              required: true
              description: Siempre nosniff, para que el navegador use el tipo que reconoció el servidor en vez de deducirlo del contenido
              schema:
                type: string
            Content-Security-Policy:
              required: true
              description: Siempre sandbox, para que un archivo abierto en el navegador no ejecute código con la sesión
              schema:
                type: string
            Cache-Control:
              required: true
              description: Siempre no-store, para que el archivo no quede guardado en cachés compartidas ni del navegador
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    SessionCookie:
      name: sigta_session
      in: cookie
      required: false
      schema:
        type: string
    ProcedureId:
      name: procedureId
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: >
        No existe, o la persona no lo puede ver: la respuesta es la misma, para
        no revelar si existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Pedido inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Sin sesión válida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: La persona no tiene permiso para esta acción
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    LoginError:
      type: string
      description: >
        Por qué no se abrió la sesión al volver del proveedor. state_mismatch:
        el ingreso no es el que inició este navegador. rejected: el proveedor
        lo rechazó o la persona lo canceló. domain_not_allowed: la cuenta no es
        del dominio institucional.
      enum: [state_mismatch, rejected, domain_not_allowed]
    StepRole:
      type: string
      description: >
        Quién hace el paso. applicant: el titular. staff: el personal del
        área del paso.
      enum: [applicant, staff]
    FieldRequirement:
      type: object
      required: [id, name, required]
      properties:
        id:
          type: string
        name:
          type: string
        required:
          type: boolean
    DocumentRequirement:
      type: object
      required: [id, name, required, accepted_types, max_size]
      properties:
        id:
          type: string
        name:
          type: string
        required:
          type: boolean
        accepted_types:
          type: array
          description: Tipos de medio aceptados, como application/pdf
          items:
            type: string
        max_size:
          type: integer
          format: int64
          description: Tamaño máximo en bytes
    CatalogEntry:
      type: object
      required:
        [id, version, name, description, deadlines, admissibility, fields, documents]
      properties:
        id:
          type: integer
          format: int64
        version:
          type: integer
        name:
          type: string
        description:
          type: string
        deadlines:
          type: array
          items:
            type: string
        admissibility:
          type: array
          description: Condiciones de admisibilidad, como texto informativo
          items:
            type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldRequirement"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRequirement"
    User:
      type: object
      required: [id, email, name, staff, administrator]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        staff:
          type: boolean
          description: >
            Si tiene al menos una membresía vigente (ADR-020). Cualquiera puede
            iniciar trámites, sea o no del personal; el personal no actúa en los
            pasos del personal de sus propios trámites
        administrator:
          type: boolean
          description: Si puede otorgar y dar de baja membresías. No da acceso a los trámites
    Area:
      type: object
      required: [id, name, permissions, roles]
      properties:
        id:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    Role:
      type: object
      required: [id, name, permissions]
      description: >
        Grupo de permisos de un área (ADR-020). Una membresía con el rol tiene
        los permisos que el rol tenga en cada momento
      properties:
        id:
          type: string
        name:
          type: string
        permissions:
          type: array
          description: Identificadores de permisos del área
          items:
            type: string
    NewRole:
      type: object
      required: [id, name, permissions]
      properties:
        id:
          type: string
          description: Minúsculas, dígitos y guiones bajos, empezando con una letra
        name:
          type: string
        permissions:
          type: array
          description: Identificadores de permisos del área, al menos uno
          items:
            type: string
    RolePermissions:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          description: Identificadores de permisos del área, al menos uno
          items:
            type: string
    NewArea:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Minúsculas, dígitos y guiones bajos, empezando con una letra
        name:
          type: string
    Permission:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    NewPermission:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Minúsculas, dígitos y guiones bajos, empezando con una letra
        name:
          type: string
    NewMembership:
      type: object
      required: [user_id, area]
      description: Necesita al menos un rol o un permiso del área
      properties:
        user_id:
          type: string
        area:
          type: string
          description: Identificador del área
        roles:
          type: array
          description: Identificadores de roles del área
          items:
            type: string
        permissions:
          type: array
          description: Identificadores de permisos del área, sueltos
          items:
            type: string
        scope:
          type: array
          description: >
            Tipos de trámite a los que se limita. Vacío o ausente vale para
            todos, incluidos los que se publiquen después
          items:
            type: integer
            format: int64
        from:
          type: string
          format: date-time
          description: Desde cuándo vale. Ausente vale desde ahora
        until:
          type: string
          format: date-time
          description: Hasta cuándo vale. Ausente vale hasta que se la dé de baja
    Membership:
      type: object
      required: [id, user_id, area, roles, permissions, scope, from, granted_by]
      properties:
        id:
          type: string
        user_id:
          type: string
        area:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        scope:
          type: array
          items:
            type: integer
            format: int64
        from:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        granted_by:
          type: string
    ProcedureDetail:
      type: object
      required: [id, procedure_type, version, name, open_step, can_act, steps]
      properties:
        id:
          type: string
        procedure_type:
          type: integer
          format: int64
        version:
          type: integer
          description: Versión del tipo de trámite con la que se inició
        name:
          type: string
          description: Nombre del tipo de trámite
        open_step:
          type: string
          description: Identificador del paso que espera ahora
        can_act:
          type: boolean
          description: Si quien mira puede hacer el paso abierto
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureStep"
    ProcedureStep:
      type: object
      required: [id, name, action, role, area_name, documents, files]
      properties:
        id:
          type: string
        name:
          type: string
        action:
          type: string
          description: >
            Qué se hace en el paso. enter_data: completar datos.
            upload_document: adjuntar documentos. confirm_external_fact:
            confirmar algo que pasó fuera de SIGTA. decide: elegir una de
            sus salidas.
          enum: [enter_data, upload_document, confirm_external_fact, decide]
        role:
          $ref: "#/components/schemas/StepRole"
        area_name:
          type: string
          description: Área del personal que hace el paso; vacío si lo hace el titular
        documents:
          type: array
          description: Documentos que pide el paso, en el orden en que los declara el tipo de trámite
          items:
            $ref: "#/components/schemas/DocumentRequirement"
        files:
          type: array
          description: >
            Archivo vigente de cada documento del paso que ya tiene uno, en el
            mismo orden que documents. Un documento sin archivo no aparece.
          items:
            $ref: "#/components/schemas/ProcedureDocument"
    ProcedureDocument:
      type: object
      required: [id, document, step, file_name, media_type, size, uploaded_by, uploaded_at, current]
      properties:
        id:
          type: string
        document:
          type: string
          description: Identificador del documento del tipo de trámite que cubre
        step:
          type: string
          description: Paso en el que se adjuntó
        file_name:
          type: string
        media_type:
          type: string
          description: Tipo que reconoció el servidor por el contenido
        size:
          type: integer
          format: int64
          description: Tamaño en bytes
        uploaded_by:
          type: string
        uploaded_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: Si es el último que se adjuntó para ese documento; los anteriores quedan registrados
