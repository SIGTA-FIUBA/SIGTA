openapi: 3.0.3
info:
  title: SIGTA
  version: 0.1.0
paths:
  /hello:
    get:
      operationId: getHello
      responses:
        "200":
          description: Saludo
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
  /auth/login:
    get:
      operationId: beginLogin
      summary: Redirige al proveedor de identidad
      parameters:
        - name: login_hint
          in: query
          required: false
          description: Correo sugerido al proveedor de identidad
          schema:
            type: string
      responses:
        "302":
          description: Redirección al proveedor de identidad
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: >
                Cookie con el ingreso pendiente (state, nonce y code verifier de
                PKCE) que se verifica al volver del proveedor
              schema:
                type: string
  /auth/callback:
    get:
      operationId: completeLogin
      summary: Recibe la respuesta del proveedor de identidad y abre la sesión
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: sigta_login_state
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Sesión abierta; redirección a la aplicación
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: Cookie de sesión
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/login-links:
    post:
      operationId: requestLoginLink
      summary: Envía por correo un enlace de ingreso de un solo uso
      description: >
        Solo acepta correos del dominio institucional. Dentro de ese dominio,
        responde igual exista o no una cuenta con ese correo, para no revelar
        quién tiene cuenta en SIGTA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Pedido aceptado
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/login-links/redeem:
    post:
      operationId: redeemLoginLink
      summary: Canjea un enlace de ingreso y abre la sesión
      description: >
        El canje es un POST desde el frontend y no un GET sobre el enlace, para
        que los filtros de correo que abren los enlaces no lo consuman.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          description: Sesión abierta
          headers:
            Set-Cookie:
              description: Cookie de sesión
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "204":
          description: Sesión cerrada
          headers:
            Set-Cookie:
              description: Cookie de sesión vencida
              schema:
                type: string
  /me:
    get:
      operationId: getCurrentUser
      summary: Perfil de la persona con sesión abierta
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /procedures/{procedureId}/documents:
    post:
      operationId: uploadDocument
      summary: Adjunta un documento al trámite
      description: >
        El tipo del archivo se detecta por su contenido, no por el nombre ni
        por el tipo que declara el navegador, y junto con el tamaño se valida
        contra la configuración del requisito que cubre. El titular solo
        adjunta documentos que cubren un requisito; la Secretaría puede
        adjuntar también documentos que no cubren ninguno, como el documento
        resolutivo.
      parameters:
        - $ref: "#/components/parameters/ProcedureId"
        - name: requirementId
          in: query
          required: false
          description: Requisito que cubre el documento
          schema:
            type: string
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Documento guardado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: El archivo supera el tamaño que admite el requisito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: El requisito no admite ese tipo de archivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /procedures/{procedureId}/documents/{documentId}/content:
    get:
      operationId: getDocumentContent
      summary: Descarga el archivo de un documento del trámite
      description: >
        Se verifica el permiso sobre el trámite en cada descarga. El archivo
        siempre se entrega como adjunto, nunca para mostrarse dentro de la
        aplicación, porque lo aportó una persona usuaria.
      parameters:
        - $ref: "#/components/parameters/ProcedureId"
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Contenido del archivo
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    ProcedureId:
      name: procedureId
      in: path
      required: true
      schema:
        type: string
    SessionCookie:
      name: sigta_session
      in: cookie
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Pedido inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Sin sesión válida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Sin permiso sobre el trámite, o el trámite no existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Role:
      type: string
      enum: [applicant, staff_operative, staff_approver]
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    Document:
      type: object
      required: [id, procedureId, filename, contentType, size, uploadedBy, uploadedAt]
      properties:
        id:
          type: string
        procedureId:
          type: string
        requirementId:
          type: string
          description: Requisito que cubre; falta si no cubre ninguno
        filename:
          type: string
        contentType:
          type: string
          description: Tipo detectado a partir del contenido
        size:
          type: integer
          format: int64
        uploadedBy:
          type: string
          description: Identificador de quien lo adjuntó
        uploadedAt:
          type: string
          format: date-time
