openapi: 3.0.3
info:
  title: SIGTA
  version: 0.1.0
paths:
  /auth/login:
    get:
      operationId: beginLogin
      summary: Redirige al proveedor de identidad
      parameters:
        - name: login_hint
          in: query
          required: false
          description: Correo sugerido al proveedor de identidad
          schema:
            type: string
      responses:
        "302":
          description: Redirección al proveedor de identidad
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: >
                Cookie con el ingreso pendiente (state, nonce y code verifier de
                PKCE) que se verifica al volver del proveedor
              schema:
                type: string
  /auth/callback:
    get:
      operationId: completeLogin
      summary: Recibe la respuesta del proveedor de identidad y abre la sesión
      description: >
        Es una navegación del navegador, así que siempre redirige: a la
        aplicación si se abrió la sesión, y a la página de ingreso con el
        parámetro error (un LoginError) si no. El ingreso pendiente sirve una
        sola vez: las dos redirecciones vencen la cookie sigta_login_state, así
        que la de la sesión abierta lleva dos encabezados Set-Cookie.
      parameters:
        - name: code
          in: query
          required: false
          description: Falta cuando el proveedor responde con error
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: >
            Error del proveedor, por ejemplo access_denied cuando la persona
            cancela el ingreso
          schema:
            type: string
        - name: sigta_login_state
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "302":
          description: >
            Redirección a la aplicación con la sesión abierta, o a la página de
            ingreso con el parámetro error
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: >
                Cookie del ingreso pendiente vencida y, si se abrió la sesión,
                cookie de sesión
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "204":
          description: Sesión cerrada
          headers:
            Set-Cookie:
              description: Cookie de sesión vencida
              schema:
                type: string
  /me:
    get:
      operationId: getCurrentUser
      summary: Perfil de la persona con sesión abierta
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /procedure-types:
    get:
      operationId: listProcedureTypes
      summary: Catálogo de los tipos de trámite publicados
      description: >
        Es público: sirve para saber si un trámite corresponde antes de tener
        una sesión. Muestra la última versión de cada tipo de trámite y solo lo
        que le toca aportar al titular.
      responses:
        "200":
          description: Tipos de trámite
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogEntry"
  /procedures:
    get:
      operationId: listProcedures
      summary: Bandeja y listado de trámites del personal
      description: >
        Solo para el personal. Con view=mine devuelve lo que el perfil de quien
        mira puede hacer ahora; con view=all, todos los trámites en curso. Los
        filtros se combinan. Las opciones de filtro salen de todos los trámites
        de la vista, sin filtrar, para que elegir un filtro no haga desaparecer
        los demás.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - name: view
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProcedureListView"
        - name: procedure_type
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProcedureState"
        - name: area
          in: query
          required: false
          description: Área responsable del paso abierto
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProcedureListSort"
      responses:
        "200":
          description: Trámites y opciones de filtro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /procedures/{id}/seen:
    put:
      operationId: markProcedureSeen
      summary: Registrar que quien mira vio el trámite
      description: >
        Solo para el personal. Guarda cuándo la persona vio el trámite por
        última vez, para que el listado deje de marcarlo con novedades hasta
        que vuelva a moverse.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Quedó registrado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    SessionCookie:
      name: sigta_session
      in: cookie
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Pedido inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Sin sesión válida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: La sesión es válida, pero su rol no puede hacer esto
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No existe o quien mira no lo puede ver
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    LoginError:
      type: string
      description: >
        Por qué no se abrió la sesión al volver del proveedor. state_mismatch:
        el ingreso no es el que inició este navegador. rejected: el proveedor
        lo rechazó o la persona lo canceló. domain_not_allowed: la cuenta no es
        del dominio institucional.
      enum: [state_mismatch, rejected, domain_not_allowed]
    Role:
      type: string
      enum: [applicant, staff_operative, staff_approver]
    FieldRequirement:
      type: object
      required: [id, name, required]
      properties:
        id:
          type: string
        name:
          type: string
        required:
          type: boolean
    DocumentRequirement:
      type: object
      required: [id, name, required, accepted_types, max_size]
      properties:
        id:
          type: string
        name:
          type: string
        required:
          type: boolean
        accepted_types:
          type: array
          description: Tipos de medio aceptados, como application/pdf
          items:
            type: string
        max_size:
          type: integer
          format: int64
          description: Tamaño máximo en bytes
    CatalogEntry:
      type: object
      required:
        [id, version, name, description, deadlines, admissibility, fields, documents]
      properties:
        id:
          type: integer
          format: int64
        version:
          type: integer
        name:
          type: string
        description:
          type: string
        deadlines:
          type: array
          items:
            type: string
        admissibility:
          type: array
          description: Condiciones de admisibilidad, como texto informativo
          items:
            type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldRequirement"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRequirement"
    ProcedureListView:
      type: string
      description: >
        mine: lo que el perfil de quien mira puede hacer ahora. all: todos los
        trámites en curso.
      enum: [mine, all]
      default: mine
    ProcedureListSort:
      type: string
      description: >
        oldest: primero los que empezaron hace más tiempo. last_moved: primero
        los que se movieron más recientemente.
      enum: [oldest, last_moved]
      default: oldest
    ProcedureState:
      type: string
      description: >
        Se deriva del área del paso abierto. with_applicant: espera al titular.
        in_office: lo tiene el personal. referred: está derivado a un evaluador
        externo. No es el resultado del trámite, que no se modela.
      enum: [with_applicant, in_office, referred]
    NamedOption:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    ProcedureListItem:
      type: object
      required:
        - id
        - procedure_type
        - procedure_type_name
        - applicant_name
        - step_name
        - step_number
        - step_count
        - area
        - area_name
        - state
        - actionable
        - started_at
        - last_moved_at
        - age_days
        - has_news
      properties:
        id:
          type: string
        procedure_type:
          type: integer
          format: int64
        procedure_type_name:
          type: string
        applicant_name:
          type: string
        applicant_program:
          type: string
          description: Carrera del titular, si la declaró
        file_number:
          type: string
          description: >
            Número del expediente electrónico, una vez que el personal lo
            registró. SIGTA no lo genera: se carga como hecho externo.
        step_name:
          type: string
          description: Paso abierto, el que se espera ahora
        step_number:
          type: integer
          minimum: 1
          description: >
            Posición del paso abierto entre los pasos del tipo de trámite, en el
            orden de la versión publicada
        step_count:
          type: integer
          minimum: 1
          description: Cantidad de pasos del tipo de trámite
        area:
          type: string
          description: Área responsable del paso abierto
        area_name:
          type: string
        state:
          $ref: "#/components/schemas/ProcedureState"
        actionable:
          type: boolean
          description: Si el perfil de quien mira puede hacer el paso abierto
        started_at:
          type: string
          format: date-time
        last_moved_at:
          type: string
          format: date-time
          description: Cuándo el trámite llegó al paso abierto
        age_days:
          type: integer
          description: Días desde que empezó el trámite
        days_referred:
          type: integer
          description: >
            Solo si está derivado: días que lleva en el evaluador externo sin
            retorno
        has_news:
          type: boolean
          description: >
            Si el trámite se movió después de la última vez que quien mira lo
            vio, o si nunca lo vio
    ProcedureList:
      type: object
      required: [items, procedure_types, areas, closed_this_month]
      properties:
        closed_this_month:
          type: integer
          description: >
            Trámites que quien mira puede ver y que se cerraron desde el primer
            día del mes en curso. Cerrar no dice el resultado, que no se modela.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureListItem"
        procedure_types:
          type: array
          description: Tipos de trámite presentes en la vista, para filtrar
          items:
            $ref: "#/components/schemas/NamedOption"
        areas:
          type: array
          description: Áreas responsables presentes en la vista, para filtrar
          items:
            $ref: "#/components/schemas/NamedOption"
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
