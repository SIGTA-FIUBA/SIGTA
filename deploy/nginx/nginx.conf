# Reverse proxy: the only entry point to SIGTA. /api/ goes to the backend
# without the prefix; everything else is the frontend. The image fills in
# SIGTA_BACKEND when it starts: backend:8080 in compose, and 127.0.0.1:8080 in
# Cloud Run, where the backend runs beside it in the same service.
server {
    listen 80;
    root /usr/share/nginx/html;

    # The same as api.MaxRequestBytes, so the backend answers an upload that
    # is too large with its own message.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://${SIGTA_BACKEND}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The design catalog (Storybook) and its plain text files for agents:
    # llms.txt, tokens.json and DESIGN.md.
    location = /design {
        return 301 /design/;
    }

    location /design/ {
        try_files $uri $uri/ =404;
        charset utf-8;
        charset_types text/plain text/markdown application/json;

        location ~ \.md$ {
            default_type text/markdown;
        }
    }

    # Unknown paths fall back to index.html so the client-side router handles them.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
