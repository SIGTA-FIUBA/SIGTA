x-update: &update
  update_config:
    order: start-first
    failure_action: rollback
    monitor: 30s
  rollback_config:
    order: start-first

services:
  proxy:
    image: ghcr.io/sigta-fiuba/sigta/proxy:${SIGTA_TAG}
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      <<: *update
      labels:
        traefik.enable: "true"
        traefik.http.routers.sigta-${ENVIRONMENT}.rule: Host(`${SIGTA_HOST}`)
        traefik.http.routers.sigta-${ENVIRONMENT}.entrypoints: websecure
        traefik.http.services.sigta-${ENVIRONMENT}.loadbalancer.server.port: "80"

  backend:
    image: ghcr.io/sigta-fiuba/sigta/backend:${SIGTA_TAG}
    environment:
      SIGTA_ENV: development
      SIGTA_IDENTITY_PROVIDER: google
      SIGTA_PUBLIC_URL: https://${SIGTA_HOST}/api
      SIGTA_APP_URL: https://${SIGTA_HOST}/
      SIGTA_ALLOWED_DOMAIN: fi.uba.ar
      SIGTA_DATABASE_URL: postgres://backend:${BACKEND_DB_PASSWORD}@db:5432/sigta?sslmode=disable
      SIGTA_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SIGTA_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - documents:/var/lib/sigta/documents
    networks:
      - app
      - db
    healthcheck:
      test: ["CMD", "/backend", "probe"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      <<: *update

volumes:
  documents:

networks:
  edge:
    name: sigta-edge
    external: true
  app:
    driver: overlay
  db:
    name: sigta-${ENVIRONMENT}-db
    external: true
