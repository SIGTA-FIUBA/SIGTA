services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: sigta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SIGTA_BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD}
      SIGTA_BACKEND_MIGRATIONS_DB_PASSWORD: ${BACKEND_MIGRATIONS_DB_PASSWORD}
      SIGTA_AI_DB_PASSWORD: ${AI_DB_PASSWORD}
    configs:
      - source: init
        target: /docker-entrypoint-initdb.d/init.sh
        mode: 0555
      - source: roles
        target: /docker-entrypoint-initdb.d/sql/roles.sql
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - db
    healthcheck:
      # Over TCP: while init.sh runs, the temporary server only listens on the
      # socket, so this is not ready until the roles exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sigta"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      placement:
        constraints: [node.role == manager]

networks:
  db:
    name: sigta-${ENVIRONMENT}-db
    driver: overlay
    attachable: true

volumes:
  db-data:

# A config cannot change once created, so its name carries the digest of the
# files (deploy.sh).
configs:
  init:
    name: sigta-${ENVIRONMENT}-db-init-${DB_INIT_DIGEST}
    file: ../postgres/init.sh
  roles:
    name: sigta-${ENVIRONMENT}-db-roles-${DB_INIT_DIGEST}
    file: ../postgres/sql/roles.sql
