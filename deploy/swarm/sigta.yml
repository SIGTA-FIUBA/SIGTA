# SIGTA on Docker Swarm, behind Traefik, with the images of a version already
# built (deploy.sh sets SIGTA_TAG). No service publishes a port on the host:
# the only way in is the Cloudflare tunnel, which reaches Traefik inside the
# edge network. The database is the stack in database.yml.
x-update: &update
  # The new task starts before the old one stops, and replaces it only once
  # healthy; otherwise Swarm goes back to the previous version.
  update_config:
    order: start-first
    failure_action: rollback
    monitor: 30s
  rollback_config:
    order: start-first

services:
  traefik:
    image: traefik:v3.7.19
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=sigta_edge
      - --entryPoints.web.address=:80
      # Port 80 is only reachable from the edge network, where the tunnel
      # sets the client address.
      - --entryPoints.web.forwardedHeaders.insecure=true
      - --ping=true
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      placement:
        constraints: [node.role == manager]

  proxy:
    image: ghcr.io/sigta-fiuba/sigta/proxy:${SIGTA_TAG}
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      <<: *update
      labels:
        traefik.enable: "true"
        traefik.http.routers.sigta.rule: Host(`${SIGTA_HOST}`)
        traefik.http.routers.sigta.entrypoints: web
        traefik.http.services.sigta.loadbalancer.server.port: "80"

  backend:
    image: ghcr.io/sigta-fiuba/sigta/backend:${SIGTA_TAG}
    environment:
      SIGTA_ENV: ${SIGTA_ENV}
      SIGTA_IDENTITY_PROVIDER: google
      SIGTA_PUBLIC_URL: https://${SIGTA_HOST}/api
      SIGTA_APP_URL: https://${SIGTA_HOST}/
      SIGTA_ALLOWED_DOMAIN: fi.uba.ar
      SIGTA_DATABASE_URL_FILE: /run/secrets/database_url
      SIGTA_GOOGLE_CLIENT_ID_FILE: /run/secrets/google_client_id
      SIGTA_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
    volumes:
      - documents:/var/lib/sigta/documents
    secrets:
      - database_url
      - google_client_id
      - google_client_secret
    networks:
      - app
      - db
    healthcheck:
      test: ["CMD", "/backend", "probe"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      <<: *update

  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    command:
      - tunnel
      - --no-autoupdate
      - --credentials-file=/run/secrets/cloudflared_credentials
      - --url=http://traefik:80
      - run
      - ${CLOUDFLARE_TUNNEL_ID}
    secrets:
      - cloudflared_credentials
    networks:
      - edge

volumes:
  documents:

networks:
  edge:
    driver: overlay
  app:
    driver: overlay
  db:
    name: sigta-db_db
    external: true

secrets:
  database_url:
    external: true
  google_client_id:
    external: true
  google_client_secret:
    external: true
  cloudflared_credentials:
    external: true
