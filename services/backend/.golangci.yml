version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    misspell:
      # Spanish domain text, not a typo of "materials".
      ignore-rules:
        - materias
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
