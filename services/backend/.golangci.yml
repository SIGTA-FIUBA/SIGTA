version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - dupl
    - errname
    - errorlint
    - gocritic
    - gosec
    - importas
    - misspell
    - noctx
    - unconvert
    - unparam
  settings:
    depguard:
      # A module uses another only through its public API, ports/input
      # (ADR-021). Tests may build the other module to run against it.
      rules:
        procedure-uses-auth-api:
          files:
            - "**/src/procedure/**"
            - "!$test"
          deny:
            - pkg: backend/src/auth/domain
              desc: use the public API of auth, backend/src/auth/ports/input (ADR-021)
            - pkg: backend/src/auth/application
              desc: use the public API of auth, backend/src/auth/ports/input (ADR-021)
            - pkg: backend/src/auth/adapters
              desc: use the public API of auth, backend/src/auth/ports/input (ADR-021)
            - pkg: backend/src/auth/ports/output
              desc: use the public API of auth, backend/src/auth/ports/input (ADR-021)
        auth-does-not-use-procedure:
          files:
            - "**/src/auth/**"
          deny:
            - pkg: backend/src/procedure
              desc: procedure depends on auth, never the reverse (ADR-021)
    importas:
      # A package of another module, or one whose name repeats across
      # modules, is imported with the same alias everywhere (CONTRIBUTING.md,
      # "Nombres").
      alias:
        - pkg: backend/src/(auth|procedure)/adapters/memory
          alias: ${1}mem
        - pkg: backend/src/(auth|procedure)/adapters/rest
          alias: ${1}rest
        - pkg: backend/src/(auth|procedure)/application
          alias: ${1}app
        - pkg: backend/src/(auth|procedure)/domain
          alias: ${1}domain
        - pkg: backend/src/(auth|procedure)/ports/(input|output)
          alias: ${1}${2}
    misspell:
      # Spanish domain text, not typos of "materials", "versions" or
      # "problems".
      ignore-rules:
        - materias
        - versiones
        - problemas
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
